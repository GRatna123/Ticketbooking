<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Services</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { background: #e74c3c; color: white; padding: 40px; text-align: center; }
        h1 { margin-bottom: 10px; }
        .bus-list { margin-top: 30px; }
        .bus-item { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .back-btn { background: #34495e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🚌 Bus Services</h1>
        <p>Find and book your bus tickets</p>
    </header>
    <div class="container">
        <div class="bus-list">
            <div class="bus-item">
                <h3>Express Bus 101</h3>
                <p>Route: Downtown - Airport</p>
                <p>Departure: Every 30 minutes</p>
            </div>
            <div class="bus-item">
                <h3>City Line 202</h3>
                <p>Route: Central Station - Mall</p>
                <p>Departure: Every 15 minutes</p>
            </div>
        </div>
        <a href="/" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
