<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Services</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { background: #3498db; color: white; padding: 40px; text-align: center; }
        h1 { margin-bottom: 10px; }
        .train-list { margin-top: 30px; }
        .train-item { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .back-btn { background: #34495e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🚆 Train Services</h1>
        <p>Train schedules and bookings</p>
    </header>
    <div class="container">
        <div class="train-list">
            <div class="train-item">
                <h3>Express Train X1</h3>
                <p>Route: City A - City B</p>
                <p>Departure: 08:00 AM, 02:00 PM, 06:00 PM</p>
            </div>
            <div class="train-item">
                <h3>Local Train L5</h3>
                <p>Route: Central - Suburbs</p>
                <p>Departure: Every hour</p>
            </div>
        </div>
        <a href="/" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
