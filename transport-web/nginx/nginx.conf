server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Main page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bus service
    location /bus {
        alias /usr/share/nginx/bus;
        try_files $uri $uri/ /bus/index.html;
    }

    # Movie service
    location /movie {
        alias /usr/share/nginx/movie;
        try_files $uri $uri/ /movie/index.html;
    }

    # Train service
    location /train {
        alias /usr/share/nginx/train;
        try_files $uri $uri/ /train/index.html;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
